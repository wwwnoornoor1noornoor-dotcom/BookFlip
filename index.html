<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookFlip</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f5f9;
}

header{
background:#2c3e50;
color:white;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.container{
max-width:600px;
margin:40px auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.15);
text-align:center;
}

input{
margin:20px;
}

button{
background:#3498db;
color:white;
border:none;
padding:12px 25px;
border-radius:8px;
font-size:18px;
cursor:pointer;
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>

<header>
📚 BookFlip
</header>

<div class="container">

<h2>حوّل ملفات PDF إلى كتاب</h2>

<p>
قريبًا ستتمكن من رفع ملف PDF وتحويله إلى كتاب يقلب صفحاته.
</p>

<input type="file" id="pdfFile" accept=".pdf">

<br>

<button onclick="convertPDF()">تحويل</button>
<canvas id="pdfCanvas" style="width:100%;border:1px solid #ccc;margin-top:20px;"></canvas>
</div>
    <script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

async function convertPDF() {

const file = document.getElementById("pdfFile").files[0];

if (!file) {
alert("الرجاء اختيار ملف PDF أولاً.");
return;
}

const data = await file.arrayBuffer();

const pdf = await pdfjsLib.getDocument({data}).promise;

const page = await pdf.getPage(1);

const canvas = document.getElementById("pdfCanvas");

const ctx = canvas.getContext("2d");

const viewport = page.getViewport({scale:1.5});

canvas.width = viewport.width;
canvas.height = viewport.height;

await page.render({
canvasContext:ctx,
viewport:viewport
}).promise;

alert("تم عرض الصفحة الأولى بنجاح 🎉");
}
</script>
</body>
</html>
