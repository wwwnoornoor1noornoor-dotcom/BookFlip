<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>BookFlip Flip</title>

<link rel="stylesheet" href="flip.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/page-flip/dist/css/page-flip.css">

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

</head>

<body>
  
<header>
<h1>📖 BookFlip Flip</h1>
</header>

<div class="container">

<input
type="file"
id="pdfFile"
accept=".pdf">

<button id="convertBtn">

تحويل

</button>
<div id="rotateMessage">

    <div class="rotateBox">

        <div class="rotateIcon">📱↻</div>

        <h2>يرجى تدوير الهاتف</h2>

        <p>
            للحصول على أفضل تجربة قراءة،
            افتح الكتاب بالوضع الأفقي.
        </p>

    </div>

</div>
<div id="book" data-density="hard"></div>

</div>

<script src="flip.js"></script>

</body>

</html>
